<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alarm Gap</title>
  <style>
    body {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      background: #f4f6f8;
      color: #17212b;
    }

    /* card styles */
    article {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border: 1px solid #d2d9e0;
      border-radius: 8px;
    }

    h2 {
      margin-top: 0;
    }

    /* dropdown and button styles */
    select,
    button {
      margin-left: 8px;
      padding: 6px 12px;
      font: inherit;
      border: 1px solid #d2d9e0;
      border-radius: 6px;
      background: white;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <main>
    <p>Team Heat Sync</p>
    <h1>Alarm Gap</h1>
    <p>How did the tested ISS smoke detector respond to smoke from different materials?</p>

    <!-- dropdown and download button -->
    <label for="material">Material</label>
    <select id="material" disabled>
      <option value="Teflon">Teflon</option>
      <option value="Kapton">Kapton</option>
    </select>
    <button id="download-csv" type="button" disabled>Download CSV</button>

    <p id="status" role="status">Loading evidence...</p>

    <!-- result cards -->
    <article id="detector-card" hidden>
      <h2 id="detector-name"></h2>
      <p id="detector-result"></p>
      <p id="detector-limit"></p>
      <a id="detector-source">See Figure 9 in the study</a>
    </article>

    <article id="test-card" hidden>
      <h2>NASA SAME Test Conditions</h2>
      <p id="test-conditions"></p>
      <p id="test-limit"></p>
      <a id="test-source">See the NASA experiment record</a>
    </article>
  </main>

  <script>
    // get elements from page
    const materialSelect = document.querySelector("#material");
    const status = document.querySelector("#status");
    const detectorCard = document.querySelector("#detector-card");
    const testCard = document.querySelector("#test-card");
    const downloadButton = document.querySelector("#download-csv");
    let visibleRecords = [];

    // show data on page
    function showEvidence(records) {
      const material = materialSelect.value;

      const detector = records.find(record =>
        record.material === material &&
        record.evidence_type === "detector_response"
      );

      const test = records.find(record =>
        record.material === material &&
        record.evidence_type === "test_conditions"
      );

      visibleRecords = [detector, test].filter(Boolean);
      downloadButton.disabled = visibleRecords.length === 0;

      detectorCard.hidden = !detector;
      testCard.hidden = !test;
      status.textContent = "";

      if (detector) {
        document.querySelector("#detector-name").textContent = detector.detector;
        document.querySelector("#detector-result").textContent = detector.reported_result;
        document.querySelector("#detector-limit").textContent = detector.limitation;
        document.querySelector("#detector-source").href = detector.source_url;
        status.textContent = "Showing evidence for " + material + ".";
      } else {
        status.textContent = "No detector finding is available for " + material + ".";
      }

      if (test) {
        document.querySelector("#test-conditions").textContent = test.conditions;
        document.querySelector("#test-limit").textContent = test.limitation;
        document.querySelector("#test-source").href = test.source_url;
      }
    }

    // helper to escape commas and quotes
    function csvCell(value) {
      const text = String(value ?? "");
      return '"' + text.replaceAll('"', '""') + '"';
    }

    // make csv and download
    function downloadCsv(records, material) {
      const columns = [
        ["Material", "material"],
        ["Evidence type", "evidence_type"],
        ["Finding", "reported_result"],
        ["Test conditions", "conditions"],
        ["Limitation", "limitation"],
        ["Source URL", "source_url"]
      ];

      const header = columns.map(column => csvCell(column[0])).join(",");
      const rows = records.map(record =>
        columns.map(column => csvCell(record[column[1]])).join(",")
      );

      const csv = [header, ...rows].join("\r\n") + "\r\n";
      const file = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(file);
      const link = document.createElement("a");

      link.href = url;
      link.download = "alarm-gap-" + material.toLowerCase() + ".csv";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // function for button
    downloadButton.addEventListener("click", () => {
      downloadCsv(visibleRecords, materialSelect.value);
    });

    // load json data
    async function loadEvidence() {
      try {
        const response = await fetch("./data/evidence.json");

        if (!response.ok) {
          throw new Error("Could not load evidence.json.");
        }

        const records = await response.json();

        if (!Array.isArray(records)) {
          throw new Error("Expected a list of evidence records.");
        }

        showEvidence(records);
        materialSelect.addEventListener("change", () => showEvidence(records));
        materialSelect.disabled = false;
      } catch (error) {
        status.textContent = "Could not load the evidence. Check public/data/evidence.json.";
        console.error(error);
      }
    }

    // start loading
    loadEvidence();
  </script>
</body>

</html>
